name = "lean_nl_semantics"
defaultTargets = ["LeanNLSemantics"]

# Mathlib supplies the automation (`tauto`, `aesop`, `norm_cast`,
# `push_cast`) used by MTT/Tactic and by the FraCaS proof harness.
# Tracking `main` rather than a pinned rev: run `lake update` after
# cloning to resolve a Mathlib commit compatible with `lean-toolchain`.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "LeanNLSemantics"

# The end-to-end pipeline's Lean side (`EndToEnd/`): the claims translated
# automatically from FraCaS's English, the quantifiers only those claims
# use, and the prover that scores them. A separate library so the default
# `lake build` (the MTT core and the hand-written FraCaS corpus) never
# builds it; its own CI job runs `lake build EndToEnd`.
[[lean_lib]]
name = "EndToEnd"

# The soundness ablations' claims (`EndToEnd/Ablations.lean`, generated by
# `EndToEnd/ablations.py`): their own library, so the end-to-end job never
# builds them; the `ablations` CI job builds and scores them.
[[lean_lib]]
name = "EndToEndAblations"
roots = ["EndToEnd.Ablations"]

# The noun-encoding comparison (`EndToEnd/Encodings/`): FraCaS Section 5
# in three encodings, generated by `gen_encodings.py`, and the proofs of
# what each commits to. Built and scored by the `encodings` CI job.
[[lean_lib]]
name = "EndToEndEncodings"
roots = ["EndToEnd.Encodings.Section5", "EndToEnd.Encodings.Commitments", "EndToEnd.Encodings.Section3"]

# Phase 2 of the comparison: every end-to-end claim with nouns as types
# (`EndToEnd/Encodings/Lifted.lean`, generated by `gen_lifted.py`). Its own
# library: built and scored by the `encodings-phase2` CI jobs.
[[lean_lib]]
name = "EndToEndLifted"
roots = ["EndToEnd.Encodings.Typed", "EndToEnd.Encodings.Equivalence", "EndToEnd.Encodings.Lifted",
  "EndToEnd.Encodings.Pullback", "EndToEnd.Encodings.Modified", "EndToEnd.Encodings.ModifiedCommitments",
  "EndToEnd.Encodings.Copredication", "EndToEnd.Encodings.Counting",
  "EndToEnd.Encodings.Criteria"]

# The held-out test (`EndToEnd/HeldOut/`): MED problems translated by the
# frozen pipeline (generated by `gen_heldout.py`). Built and scored by the
# `heldout` CI job.
[[lean_lib]]
name = "EndToEndHeldOut"
roots = ["EndToEnd.HeldOut.Claims"]

# The second held-out test (`EndToEnd/HeldOut/SICK/`): SICK pairs translated
# by the frozen pipeline (generated by `gen_sick.py`). Built and scored by
# the `sick` CI job.
[[lean_lib]]
name = "EndToEndSick"
roots = ["EndToEnd.HeldOut.SICK.Claims"]
