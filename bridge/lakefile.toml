name = "linglib_bridge"
defaultTargets = ["LinglibBridge"]

# A genuinely separate Lake package (its own manifest, its own
# `lean-toolchain`), on purpose — see `LinglibBridge.lean`'s header and
# `.github/workflows/build.yml`'s `build-linglib-bridge` job. linglib is
# a fast-moving, single-maintainer project pinned to one commit here
# since this bridge is Phase 2b, optional, exploratory work: a version
# conflict between this and the main `lean_nl_semantics` package's own
# (unpinned, tracking `main`) Mathlib requirement must never be able to
# affect the main package's build, and putting them in one shared
# lakefile.toml/manifest would risk exactly that.
[[require]]
name = "linglib"
git = "https://github.com/hawkrobe/linglib.git"
rev = "8cd728cf2c0386b11ad7057ecac4946dff58a668"

# Reuses `../LeanNLSemantics/MTT/*.lean` files directly as source (via
# `srcDir`, not a Lake package dependency), so the bridge always tracks
# the same `CN`/`CNTag`/`Individual`/`Intersective`/etc. the main
# package's core library uses, without a second copy to drift out of
# sync, and without pulling in the main package's own Mathlib
# requirement or its 342-theorem FraCaS suite as a Lake-level
# dependency. `srcDir` points at the repo root itself, not at
# `../LeanNLSemantics`, specifically so module names here match
# `LeanNLSemantics.MTT.*` exactly — the same names those files' own
# internal `import` lines use (`Adjectives.lean` imports
# `LeanNLSemantics.MTT.Quantifiers`, not `MTT.Quantifiers`) — so a
# reused file's own cross-imports resolve unchanged no matter how many
# more of them get pulled in later. `FraCaS.Section1.GQ` is the one file
# from the suite reused here (for `Section1GQCrossCheck.lean`): it only
# `import Mathlib` itself, no other FraCaS file, so including it is
# still one specific file, not a path to the whole suite.
[[lean_lib]]
name = "MTTCore"
srcDir = ".."
roots = [
  "LeanNLSemantics.MTT.CN",
  "LeanNLSemantics.MTT.Quantifiers",
  "LeanNLSemantics.MTT.Adjectives",
  "LeanNLSemantics.FraCaS.Section1.GQ",
]

[[lean_lib]]
name = "LinglibBridge"
roots = [
  "LinglibBridge",
  "LinglibBridge.Section5Pilot",
  "LinglibBridge.ToyFragment",
  "LinglibBridge.Section1GQCrossCheck",
]
