name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # No lake-manifest.json is committed (nothing here has ever
      # actually resolved the Mathlib dependency), so `lake build` alone
      # fails with "No lake-manifest.json found" — `lake update` writes
      # it first. Once one exists, commit it so future runs are pinned
      # to a fixed Mathlib revision instead of re-resolving `main` every time.
      - name: Resolve dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

  # Phase 2b: the linglib bridge (`bridge/`) is a genuinely separate Lake
  # package with its own manifest, so a version conflict between this
  # repo's (unpinned, tracking `main`) Mathlib and linglib's own pinned
  # Mathlib commit can only ever affect *this* job, never the `build` job
  # above — the two never share a lake-manifest.json or resolution.
  # `continue-on-error` at the job level, not just the step level, so a
  # failure here never flips the workflow run's overall conclusion.
  build-linglib-bridge:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        working-directory: bridge
        run: lake update

      - name: Fetch Mathlib cache
        working-directory: bridge
        run: lake exe cache get

      - name: Build
        working-directory: bridge
        run: lake build

  # Phase 3: build the GF toolchain from source and run the confirmed
  # `linearize` checks (gf/run_gf_tests.py) automatically on every push,
  # instead of relying on someone manually running `linearize` on a
  # separate machine and eyeballing the output (see gf/NOTES.md for how
  # every one of these gotchas was originally found that way).
  #
  # GitHub's runners have normal internet access - no restrictive egress
  # policy - unlike the sandbox this repo's own Lean/CI work is otherwise
  # developed in, where installing GF's Haskell toolchain is blocked.
  #
  # continue-on-error while Section 1 coverage is actively being
  # extended (many new sentence shapes in quick succession) - re-remove
  # once that work settles down, same reasoning as when this was first
  # added and then removed after a single proven-green run.
  #
  # gf-core and gf-rgl are pinned to the exact commit/tag already
  # confirmed working by hand (gf/NOTES.md), not `main`/latest, for
  # reproducibility. Both the built `gf` binary and the compiled RGL are
  # cached, keyed on those pins, so only the first run after a pin
  # change pays the full build cost (RGL's Setup.sh builds every
  # language it knows, not just English, which is slow from scratch).
  build-gf:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GF_CORE_COMMIT: 378bfe691041878ca9fadd4697f1e58dc1620931
      GF_RGL_TAG: "20260403"
    steps:
      - uses: actions/checkout@v4

      # Checked before haskell-actions/setup@v2 (not after, the original
      # order): that setup step costs ~2 minutes on its own even when
      # its own output (a GHC/cabal toolchain) ends up unused, because
      # the gf binary this job actually needs is already cache-hit and
      # "Build gf-core" below skips accordingly. Moving the cache check
      # first lets both the Haskell setup and the cabal-store cache
      # restore be skipped too on that same common case, cutting this
      # job to well under a minute instead of ~3.
      - name: Cache built gf binary
        id: cache-gf-bin
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gf
          key: gf-binary-${{ runner.os }}-${{ env.GF_CORE_COMMIT }}

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        if: steps.cache-gf-bin.outputs.cache-hit != 'true'
        with:
          ghc-version: "9.6.7"
          cabal-version: "latest"

      - name: Cache cabal store
        if: steps.cache-gf-bin.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-gf-cabal-9.6.7

      - name: Build gf-core
        if: steps.cache-gf-bin.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/GrammaticalFramework/gf-core.git /tmp/gf-core
          cd /tmp/gf-core
          git checkout "$GF_CORE_COMMIT"
          cabal update
          mkdir -p "$HOME/.local/bin"
          cabal install --installdir="$HOME/.local/bin" --install-method=copy --overwrite-policy=always

      - name: Add gf to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache gf-rgl build
        id: cache-rgl
        uses: actions/cache@v4
        with:
          path: ~/gf-libs
          # "-dict1" suffix (not just GF_RGL_TAG): this key's own cached
          # contents changed shape (now includes DictEngAbs/DictEng too)
          # without the tag itself changing, so the key needs its own
          # bump too - otherwise a same-tag cache from before this pilot
          # would cache-HIT and skip rebuilding, silently missing the
          # newly-added DictEngAbs/DictEng.gfo the grammar now needs.
          key: gf-rgl-${{ runner.os }}-${{ env.GF_RGL_TAG }}-dict1

      - name: Build gf-rgl
        if: steps.cache-rgl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/GrammaticalFramework/gf-rgl.git /tmp/gf-rgl
          cd /tmp/gf-rgl
          git checkout "$GF_RGL_TAG"
          ./Setup.sh --dest="$HOME/gf-libs" -v

      # DictEngAbs/DictEng (the RGL's ~30k-line general English dictionary,
      # see gf/NOTES.md) is deliberately NOT part of Setup.sh's own build
      # output (its module-name glob only looks for AllEng/TryEng/etc.-
      # shaped files, never DictEng). Compiled here instead, straight into
      # the same ~/gf-libs/alltenses Setup.sh already populated, so it's
      # covered by the exact same cache-hit guard/key above and is only
      # ever paid for once. `time` reports the real cost in the log - see
      # gf/NOTES.md for the measured result and the pilot this supports.
      - name: Build DictEng (dictionary integration pilot)
        if: steps.cache-rgl.outputs.cache-hit != 'true'
        run: |
          cd /tmp/gf-rgl
          time gf --batch --quiet --gf-lib-path="$HOME/gf-libs" \
            --no-pmcfg --gfo-dir="$HOME/gf-libs/alltenses" \
            src/english/DictEngAbs.gf src/english/DictEng.gf

      - name: Build FraCaSLogic grammar
        working-directory: gf
        run: gf -make -path=".:$HOME/gf-libs/alltenses:$HOME/gf-libs/prelude" FraCaSLogicEng.gf

      - name: Run linearize checks
        working-directory: gf
        run: python3 run_gf_tests.py
