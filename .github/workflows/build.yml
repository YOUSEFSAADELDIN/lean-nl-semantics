name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # lake-manifest.json is now committed (captured from CI run
      # 36313846108, commit 219ecca - see it for the exact resolution
      # this pins: mathlib b63f6e8a, aesop a90fbf7b, batteries 33131f4f,
      # etc.), so every run resolves against that fixed revision set
      # instead of re-resolving Mathlib's `main` from scratch each time -
      # a future unrelated upstream break can no longer turn this
      # project's CI red with zero code change here. `lake update` only
      # runs as a fallback (a fresh clone/fork missing the manifest, or
      # someone deliberately deleting it to re-resolve); it is never run
      # when the pin is already in place, since running it unconditionally
      # would silently re-resolve to `main` and defeat the pin on every
      # single run.
      - name: Resolve dependencies
        run: |
          if [ ! -f lake-manifest.json ]; then
            lake update
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      # Coverage.lean is deliberately not imported by anything (it itself
      # imports the root LeanNLSemantics umbrella to scan every proved
      # FraCaS theorem, so importing it back from that umbrella would be
      # circular) - `lake build` above never touches it. Run it directly
      # instead, reusing the oleans `lake build` just produced: its
      # `#mono_nl_coverage` command logs, via plain `logInfo`, which of
      # the 342 FraCaS theorems the Phase-1 monotonicity fragment closes
      # automatically and which it doesn't, without this step adding any
      # rule to make more of them fit.
      - name: Monotonicity fragment coverage scan
        run: lake env lean LeanNLSemantics/FraCaS/Section1/Monotonicity/Coverage.lean

      # BlindEval.lean is deliberately not imported by anything either
      # (same circularity reason as Coverage.lean just above) - run
      # directly, reusing the oleans `lake build` already produced.
      - name: Blind evaluation (Sections 1-2)
        run: lake env lean LeanNLSemantics/FraCaS/Section1/Monotonicity/BlindEval.lean

      # BlindEvalUnknownScan.lean imports BlindEvalCore.lean (the reusable
      # part of BlindEval.lean's own methodology, factored out precisely so
      # this file could reuse it without importing BlindEval.lean itself -
      # see BlindEvalCore.lean's own header for why that would be circular
      # the same way Coverage.lean/BlindEval.lean already are) - run
      # directly. Covers what BlindEval.lean's own scan above skips:
      # Sections 1-2's `.unknown`/`.undef` countermodel-pair problems, via a
      # generic Prop per problem (BlindEvalUnknown.lean, generated by
      # scripts/gen_blind_eval_unknown.py - that file itself IS part of the
      # normal `lake build` above, needed for its own .olean to exist before
      # this step's `lake env lean` runs, same as BlindEvalCore.lean).
      - name: Blind evaluation, unknown/undef pairs (Sections 1-2)
        run: lake env lean LeanNLSemantics/FraCaS/Section1/Monotonicity/BlindEvalUnknownScan.lean

      # Same circularity reason as BlindEval.lean just above (imports the
      # root LeanNLSemantics umbrella to scan every already-proved
      # theorem in Sections 3-9) - run directly, reusing the oleans
      # `lake build` already produced, including BlindEvalCore.lean's
      # (added to the main import list specifically so files like this
      # one can reuse its attemptClose/negateConclusion without importing
      # BlindEval.lean itself - see BlindEvalCore.lean's own header).
      - name: Blind evaluation (Sections 3-9)
        run: lake env lean LeanNLSemantics/FraCaS/BlindEvalSections3to9.lean
      # AssumptionAudit.lean is deliberately not imported by anything
      # either, same reason as Coverage.lean above (it imports the root
      # LeanNLSemantics umbrella, so importing it back would be
      # circular) - run directly, reusing the oleans `lake build` above
      # just produced. Its `#print axioms` commands log, per theorem,
      # exactly which axioms the kernel actually used - the corpus-wide
      # extension of MTT/AssumptionAudit.lean's own 14-theorem audit
      # (see that file for the CI-confirmed result on the MTT side).
      - name: FraCaS corpus assumption audit
        run: lake env lean LeanNLSemantics/FraCaS/AssumptionAudit.lean

  # Phase 2b: the linglib bridge (`bridge/`) is a genuinely separate Lake
  # package with its own manifest, so a version conflict between this
  # repo's (unpinned, tracking `main`) Mathlib and linglib's own pinned
  # Mathlib commit can only ever affect *this* job, never the `build` job
  # above — the two never share a lake-manifest.json or resolution.
  # `continue-on-error` at the job level, not just the step level, so a
  # failure here never flips the workflow run's overall conclusion.
  build-linglib-bridge:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        working-directory: bridge
        run: lake update

      - name: Fetch Mathlib cache
        working-directory: bridge
        run: lake exe cache get

      - name: Build
        working-directory: bridge
        run: lake build

  # Phase 3: build the GF toolchain from source and run the confirmed
  # `linearize` checks (gf/run_gf_tests.py) automatically on every push.
  # All 342 FraCaS problems' worth of sentence shapes (all nine
  # sections, 803 linearize checks) were built and validated against a
  # locally-built copy of this exact same toolchain (gf-core/gf-rgl
  # pinned to the commits below) before ever being pushed - see
  # gf/NOTES.md for the full setup and every gotcha hit getting there,
  # including how a local toolchain build in this project's own
  # sandbox, once thought blocked, turned out to be a fixable `cabal`
  # TUF-signature issue instead.
  #
  # continue-on-error removed: PR #13 (github.com/YOUSEFSAADELDIN/
  # lean-nl-semantics/pull/13) proved this job green on real GitHub
  # Actions across two separate runs against the local-toolchain-
  # validated state above, confirming the local and CI environments
  # agree - the "prove it, don't assume it" bar the rest of this
  # project holds to. If a future pin change (gf-core/gf-rgl commit) or
  # a genuinely new construction ever needs a soft-landing period
  # again, re-add it deliberately with the same reasoning, not by
  # default.
  #
  # gf-core and gf-rgl are pinned to the exact commit/tag already
  # confirmed working by hand (gf/NOTES.md), not `main`/latest, for
  # reproducibility. Both the built `gf` binary and the compiled RGL are
  # cached, keyed on those pins, so only the first run after a pin
  # change pays the full build cost (RGL's Setup.sh builds every
  # language it knows, not just English, which is slow from scratch).
  build-gf:
    runs-on: ubuntu-latest
    env:
      GF_CORE_COMMIT: 378bfe691041878ca9fadd4697f1e58dc1620931
      GF_RGL_TAG: "20260403"
    steps:
      - uses: actions/checkout@v4

      # Checked before haskell-actions/setup@v2 (not after, the original
      # order): that setup step costs ~2 minutes on its own even when
      # its own output (a GHC/cabal toolchain) ends up unused, because
      # the gf binary this job actually needs is already cache-hit and
      # "Build gf-core" below skips accordingly. Moving the cache check
      # first lets both the Haskell setup and the cabal-store cache
      # restore be skipped too on that same common case, cutting this
      # job to well under a minute instead of ~3.
      - name: Cache built gf binary
        id: cache-gf-bin
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gf
          key: gf-binary-${{ runner.os }}-${{ env.GF_CORE_COMMIT }}

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        if: steps.cache-gf-bin.outputs.cache-hit != 'true'
        with:
          ghc-version: "9.6.7"
          cabal-version: "latest"

      - name: Cache cabal store
        if: steps.cache-gf-bin.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-gf-cabal-9.6.7

      - name: Build gf-core
        if: steps.cache-gf-bin.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/GrammaticalFramework/gf-core.git /tmp/gf-core
          cd /tmp/gf-core
          git checkout "$GF_CORE_COMMIT"
          cabal update
          mkdir -p "$HOME/.local/bin"
          cabal install --installdir="$HOME/.local/bin" --install-method=copy --overwrite-policy=always

      - name: Add gf to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache gf-rgl build
        id: cache-rgl
        uses: actions/cache@v4
        with:
          path: ~/gf-libs
          # "-dict1" suffix (not just GF_RGL_TAG): this key's own cached
          # contents changed shape (now includes DictEngAbs/DictEng too)
          # without the tag itself changing, so the key needs its own
          # bump too - otherwise a same-tag cache from before this pilot
          # would cache-HIT and skip rebuilding, silently missing the
          # newly-added DictEngAbs/DictEng.gfo the grammar now needs.
          key: gf-rgl-${{ runner.os }}-${{ env.GF_RGL_TAG }}-dict1

      - name: Build gf-rgl
        if: steps.cache-rgl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/GrammaticalFramework/gf-rgl.git /tmp/gf-rgl
          cd /tmp/gf-rgl
          git checkout "$GF_RGL_TAG"
          ./Setup.sh --dest="$HOME/gf-libs" -v

      # DictEngAbs/DictEng (the RGL's ~30k-line general English dictionary,
      # see gf/NOTES.md) is deliberately NOT part of Setup.sh's own build
      # output (its module-name glob only looks for AllEng/TryEng/etc.-
      # shaped files, never DictEng). Compiled here instead, straight into
      # the same ~/gf-libs/alltenses Setup.sh already populated, so it's
      # covered by the exact same cache-hit guard/key above and is only
      # ever paid for once. `time` reports the real cost in the log - see
      # gf/NOTES.md for the measured result and the pilot this supports.
      - name: Build DictEng (dictionary integration pilot)
        if: steps.cache-rgl.outputs.cache-hit != 'true'
        run: |
          cd /tmp/gf-rgl
          time gf --batch --quiet --gf-lib-path="$HOME/gf-libs" \
            --no-pmcfg --gfo-dir="$HOME/gf-libs/alltenses" \
            src/english/DictEngAbs.gf src/english/DictEng.gf

      - name: Build FraCaSLogic grammar
        working-directory: gf
        run: gf -make -path=".:$HOME/gf-libs/alltenses:$HOME/gf-libs/prelude" FraCaSLogicEng.gf

      - name: Run linearize checks
        working-directory: gf
        run: python3 run_gf_tests.py
