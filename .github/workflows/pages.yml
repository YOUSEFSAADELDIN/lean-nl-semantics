name: Deploy Semantics Lab site

# Publishes viz/ (the Semantics Lab, the reasoner trace explorer, the
# corpus reference, and the recruiter-facing supplement) to GitHub
# Pages. Triggered by a push to main so the live site always reflects
# whatever has actually been merged - never a feature branch - plus a
# manual dispatch for one-off redeploys.
on:
  push:
    branches: [main]
    paths: ["viz/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz
      - id: deployment
        uses: actions/deploy-pages@v4
